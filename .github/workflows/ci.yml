name: CI

# Este é o status que a Railway espera em "Wait for CI" (ADR-014 §7).
on:
  push:
    branches: [main, production]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # os testes de integração sobem Postgres e Redis com Testcontainers
  TESTCONTAINERS_RYUK_DISABLED: 'true'
  NODE_ENV: test

jobs:
  qualidade:
    name: Lint, tipos e fronteiras
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Formatação
        run: pnpm format:check

      - name: Lint e fronteiras entre módulos
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

  testes:
    name: Testes (unit, integração e isolamento)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # inclui os testes de RLS, outbox/DLQ e a suíte de isolamento entre
      # tenants (US-074), que sobem Postgres e Redis reais com as mesmas roles
      # de infra/db/bootstrap-roles.sql
      - name: Testes
        run: pnpm test

  contrato:
    name: OpenAPI em dia
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Regenerar a especificação
        run: pnpm gen:openapi

      # mudar contrato sem atualizar o OpenAPI quebra aqui (CLAUDE.md §8)
      - name: A especificação versionada está atualizada?
        run: git diff --exit-code -- docs/api/openapi.json

  imagens:
    name: Build das imagens Docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [api, worker, storefront, admin, seller-center, console]
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # o contexto é a raiz do monorepo (07-infraestrutura-railway.md §3)
      - name: Build ${{ matrix.app }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  seguranca:
    name: Segredos e dependências
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          # o gitleaks precisa do histórico para varrer os commits do PR
          fetch-depth: 0

      - name: Segredos vazados (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Vulnerabilidades em dependências
        run: pnpm audit --audit-level high

  # portão único para a proteção de branch e para o "Wait for CI" da Railway
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [qualidade, testes, contrato, imagens, seguranca]
    if: always()
    steps:
      - name: Resultado
        run: |
          echo "qualidade=${{ needs.qualidade.result }}"
          echo "testes=${{ needs.testes.result }}"
          echo "contrato=${{ needs.contrato.result }}"
          echo "imagens=${{ needs.imagens.result }}"
          echo "seguranca=${{ needs.seguranca.result }}"
          [ "${{ needs.qualidade.result }}" = "success" ] \
            && [ "${{ needs.testes.result }}" = "success" ] \
            && [ "${{ needs.contrato.result }}" = "success" ] \
            && [ "${{ needs.imagens.result }}" = "success" ] \
            && [ "${{ needs.seguranca.result }}" = "success" ]
